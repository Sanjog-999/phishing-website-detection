
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Website Detection</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101827, #173b58);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            color: #182230;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 12px 35px #0005;
        }

        h1 {
            text-align: center;
            color: #173b58;
            margin-top: 0;
        }

        p {
            text-align: center;
            color: #586575;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 25px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #104e80;
        }

        .result {
            margin-top: 22px;
            padding: 16px;
            text-align: center;
            border-radius: 8px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .safe {
            background: #dcfce7;
            color: #166534;
        }

        .danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .warning {
            margin-top: 20px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔐 Phishing Website Detection</h1>

        <p>
            Check a website URL using our
            Machine Learning model.
        </p>

        <form method="POST">
            <label for="url">Enter Website URL</label>

            <input
                type="text"
                id="url"
                name="url"
                placeholder="https://example.com"
                value="{{ url }}"
                required
            >

            <button type="submit">Check Website</button>
        </form>

        {% if result %}
            <div class="result
                {% if result == 'Legitimate Website' %}
                    safe
                {% else %}
                    danger
                {% endif %}">
                Prediction: {{ result }}
            </div>
        {% endif %}

        <p class="warning">
            Note: This is an ML-based prediction and may be
            incorrect. Do not rely on it alone for security decisions.
        </p>
    </div>
</body>
</html>
